id: CV-RES-01
program: cardiovita-pap-2026
kind: residency
fields:
  - country_of_residence
  - mailing_state
title: U.S. resident with valid physical mailing address
criterion: >-
  `country_of_residence` = "US" AND `mailing_state` ∈ U.S. state or territory
  (PR, GU, VI, AS, MP)
exception: >-
  P.O. Box alone is not sufficient — physical street address required for
  cold-chain signature-on-delivery.
