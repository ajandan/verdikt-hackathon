<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NVIDIA model chips</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: 'Inter', sans-serif; }
  body { display: flex; gap: 40px; padding: 40px; align-items: flex-start; }
  .chip {
    display: inline-flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 12px 26px rgba(0,0,0,0.42), 0 4px 10px rgba(0,0,0,0.30);
    min-width: 380px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    background: #141410; color: #fff;
    padding: 10px 18px 10px 16px;
    font-size: 22px; font-weight: 800;
    letter-spacing: 0.24em; text-transform: uppercase;
  }
  .brand .mark {
    display: inline-block;
    width: 28px; height: 28px;
    background: #76b900;
    clip-path: polygon(30% 0, 100% 50%, 30% 100%, 0 100%, 65% 50%, 0 0);
  }
  .model {
    background: #76b900; color: #0d0d0a;
    padding: 14px 20px;
    font-size: 34px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  /* Nebius Token Factory variant — used for MiniCPM-V (OpenBMB Apache-2.0). */
  .chip.nebius .brand { background: #0d0d0a; }
  .chip.nebius .brand .mark { background: #ff7a00; clip-path: none; border-radius: 50%; position: relative; }
  .chip.nebius .brand .mark::after {
    content: ""; position: absolute; inset: 5px 5px 5px 5px;
    background: #0d0d0a; border-radius: 50%;
  }
  .chip.nebius .brand .mark::before {
    content: ""; position: absolute;
    top: 50%; left: 50%; width: 4px; height: 4px;
    background: #ff7a00; border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }
  .chip.nebius .brand-label {
    font-size: 15px; letter-spacing: 0.20em;
    line-height: 1.05;
  }
  .chip.nebius .brand-label b { display: block; font-size: 21px; letter-spacing: 0.24em; }
  .chip.nebius .model { background: #ff7a00; color: #141410; }
</style>
</head>
<body>

<!-- Chip IDs kept stable so assemble_video.sh continues to pick them up
     as chips/nv-ingest.png, chips/nemo.png, chips/nemotron.png.
     Content updated to reflect the current three AI stages:
       - chip-minicpm-v  -> Vision-language (Ingest)
       - chip-qwen-embed -> Classifier      (Triage)
       - chip-nemotron   -> Reasoning       (Decide)
     After editing here, re-render the chip PNGs with Playwright
     (transparent background) and drop into assets/video/screenshots/chips/. -->

<div class="chip nebius" id="chip-minicpm-v">
  <div class="brand"><span class="mark"></span><span class="brand-label"><b>NEBIUS</b>TOKEN FACTORY</span></div>
  <div class="model">Vision-language</div>
</div>

<div class="chip nebius" id="chip-qwen-embed">
  <div class="brand"><span class="mark"></span><span class="brand-label"><b>NEBIUS</b>TOKEN FACTORY</span></div>
  <div class="model">Classifier</div>
</div>

<div class="chip nebius" id="chip-nemotron">
  <div class="brand"><span class="mark"></span><span class="brand-label"><b>NEBIUS</b>TOKEN FACTORY</span></div>
  <div class="model">Reasoning</div>
</div>

</body>
</html>
