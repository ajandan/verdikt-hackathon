id: CV-RES-01
program: cardiovita-pap-2026
kind: residency
fields:
  - country_of_residence
  - mailing_state
text: >
  Applicant must be a resident of the United States or a U.S. territory
  (Puerto Rico, Guam, U.S. Virgin Islands, American Samoa, Northern Mariana
  Islands) and must supply a valid U.S. mailing address at which medication
  shipments can be received. Non-U.S. residents are ineligible even if they
  are temporarily receiving care from a U.S. prescriber. A P.O. Box alone is
  not sufficient — a physical street address in the applicant's state of
  residence is required.
