id: OB-INS-01
program: oncobridge-pap-2026
kind: insurance
fields:
  - insurance_status
  - has_denial_letter
title: Active prescription-drug coverage gap during bridge window
criterion: >-
  `insurance_status` ∈ {uninsured, between plans (open enrollment / COBRA),
  commercial with `has_denial_letter`=true}
exception: >-
  Medicaid enrollees ineligible. Medicare Part D eligible only with a written
  denial letter for this therapy.
