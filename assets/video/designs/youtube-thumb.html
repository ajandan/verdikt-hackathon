<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>YouTube thumbnail — Verdikt submission</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* Rendered at the scripts/make_thumbnail.py downsamples to
     1280x720 with LANCZOS so the serif edges stay crisp. A thumbnail is read
     at roughly 210px wide in a YouTube list, so everything here is sized to
     survive a 6x reduction: three short lines, one accent colour, no body
     copy, and nothing that depends on fine detail. */
  body::before { display: none; }
  body { margin: 0; }

  .thumb {
    width: 1920px; height: 1080px;
    position: relative; overflow: hidden;
    background: var(--ink-50);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 0 112px;
    box-sizing: border-box;
  }
  /* Same layered paper wash as the title card, so the thumbnail and the
     video's first frame read as the same object. */
  .thumb::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(1600px 950px at 18% 12%, rgba(47,143,118,0.09), transparent 62%),
      radial-gradient(1200px 800px at 88% 88%, rgba(30,95,79,0.07), transparent 62%);
  }
  /* Seal-green edge: reads as a colour block even when the type does not. */
  .thumb::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0; width: 26px;
    background: linear-gradient(180deg, var(--seal-500), var(--seal-700));
  }

  .left { position: relative; z-index: 2; }

  .kicker {
    font-family: var(--font-mono);
    font-size: 29px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--seal-700);
    margin-bottom: 34px;
  }
  .kicker .sep { color: var(--ink-300); margin: 0 18px; }

  .line {
    font-family: var(--font-serif);
    font-size: 147px; line-height: 1.0;
    color: var(--ink-900);
    letter-spacing: -0.02em;
    margin: 0;
  }
  /* The differentiator gets the accent and the italic. Everything the deck
     and the narration build toward is this third line. */
  .line.accent { color: var(--seal-500); font-style: italic; }

  .rule {
    width: 143px; height: 8px;
    background: var(--seal-500);
    margin: 40px 0 30px;
    border-radius: 6px;
  }
  .stages {
    display: flex; gap: 20px;
    font-family: var(--font-mono);
    font-size: 23px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-700);
  }
  .stages i { color: var(--ink-300); font-style: normal; }

  .right { position: relative; z-index: 2; text-align: center; }
  .mark {
    width: 315px; height: 315px;
    background: url('verdikt-mark.png') center/contain no-repeat;
    filter: drop-shadow(0 40px 70px rgba(20,20,16,0.18));
    margin: 0 auto 20px;
  }
  .wordmark {
    font-family: var(--font-serif); font-style: italic;
    font-size: 113px; line-height: 0.9; color: var(--ink-900);
    letter-spacing: -0.03em;
  }
  .wordmark .dot { color: var(--seal-500); font-style: normal; }
</style>
</head>
<body>
  <div class="thumb">
    <div class="left">
      <div class="kicker">Nebius <span class="sep">&times;</span> NVIDIA <span class="sep">&middot;</span> 2026</div>
      <p class="line">AI reads.</p>
      <p class="line">Code writes.</p>
      <p class="line accent">Humans decide.</p>
      <div class="rule"></div>
      <div class="stages">
        <span>Ingest</span><i>&rsaquo;</i>
        <span>Triage</span><i>&rsaquo;</i>
        <span>Decide</span><i>&rsaquo;</i>
        <span>Deliver</span><i>&rsaquo;</i>
        <span>Remember</span>
      </div>
    </div>
    <div class="right">
      <div class="mark"></div>
      <div class="wordmark">Verdikt<span class="dot">.</span></div>
    </div>
  </div>
</body>
</html>
