[project]
name = "docgen"
version = "0.1.0"
description = "Template-based document generation service (design-time AI, deterministic render)."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # Lower bounds picked to exclude known CVE ranges:
    #   fastapi <0.115.8         → CVE-2026-2978 (Starlette BadHost / RCE chain)
    #   python-multipart <0.0.18 → CVE-2024-53981 (multipart boundary DoS)
    #   jinja2 <3.1.5            → CVE-2024-56201 / 56326 (sandbox escapes)
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "dramatiq[redis]>=1.17",
    "redis>=5.1",
    "boto3>=1.35",
    "botocore>=1.35",
    "docxtpl>=0.19",
    "python-docx>=1.1",
    # PDF templating stack (kind='pdf'):
    #   pypdf      — AcroForm widget read + fill, page merge for flat overlay
    #   pypdfium2  — page-image previews for the flat placement editor + preflight (Apache-2.0)
    #   pdfplumber — vector geometry + text-with-bboxes for field detection (MIT)
    #   reportlab  — draw the value overlay layer before merging with pypdf
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    # pymupdf is being phased out (ADR-0001 Option 2) — kept during incremental
    # migration so tests pass at each step; removed in the final cleanup commit.
    "pymupdf>=1.24",
    "reportlab>=4.0",
    "jinja2>=3.1.5",
    "lxml>=5.3",
    "httpx>=0.27",
    # `mcp.server.MCPServer` (used in mcp_server.py) is a 2.x export; earlier
    # releases exposed `FastMCP` under a different path and would fail import.
    "mcp>=2.0",
    "structlog>=24.4",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pip-licenses>=5.0",
    "pre-commit>=4.0",
]

[project.scripts]
docgen-web = "docgen.main:run"
docgen-worker = "docgen.worker:run"
docgen-mcp = "docgen.mcp_server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends(...) in default arguments is idiomatic.
    "RUF012", # SQLAlchemy's type_annotation_map / mutable class defaults are idiomatic.
    "UP037",  # Forward-ref quoted annotations sometimes required by SQLAlchemy relationship().
    "RUF002", # En-dashes/arrows in docstrings are intentional (design-doc references).
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "F401"]
"scripts/**" = ["B"]
"alembic/**" = ["E", "F", "UP", "B"]  # Alembic templates and generated migrations
