id: OB-CLIN-01
program: oncobridge-pap-2026
kind: clinical
fields:
  - prescribed_drug
  - prescriber_npi
  - prescription_date
title: Current Rx (any FDA-approved outpatient drug) from active U.S. prescriber
criterion: >-
  `prescribed_drug` FDA-approved for outpatient dispensing AND `prescriber_npi`
  active in NPPES AND `prescription_date` within last 6 months
exception: >-
  Signature stamps not accepted — prescriber countersignature on OB-200
  Section 6 is required.
