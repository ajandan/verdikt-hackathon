id: CV-INC-01
program: cardiovita-pap-2026
kind: financial
fields:
  - household_size
  - annual_household_income
title: Household income at or below 400% FPL for household size
criterion: >-
  `annual_household_income` ≤ 400% × 2026 FPL(`household_size`)
exception: >-
  If `req_pap` is checked but ASP-110 worksheet is missing or has blank
  fields, return missing_info instead of deny.
