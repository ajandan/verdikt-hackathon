<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stage timeline overlay (lower-left)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: 'Inter', sans-serif; }
  body { padding: 14px; display: inline-block; }
  #pill {
    display: inline-flex; align-items: stretch;
    background: linear-gradient(180deg, rgba(30,30,24,0.94), rgba(20,20,16,0.94));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    box-shadow: 0 14px 30px -10px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .tag {
    display: flex; flex-direction: column; justify-content: center;
    padding: 10px 16px 10px 18px;
    border-right: 1px solid rgba(255,255,255,0.10);
    font-family: 'IBM Plex Mono', monospace;
    color: rgba(255,255,255,0.5); font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; line-height: 1.25;
  }
  .tag b { color: #8ec7b5; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; }
  .steps { display: flex; align-items: center; padding: 8px 10px; gap: 2px; }
  .step {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 8px 14px; border-radius: 10px;
  }
  .step .n {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600;
    color: rgba(255,255,255,0.40); letter-spacing: 0.06em;
  }
  .step .lbl {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,0.50); letter-spacing: 0.16em; text-transform: uppercase; line-height: 1;
  }
  .step.done .n  { color: #8ec7b5; }
  .step.done .lbl { color: rgba(255,255,255,0.78); }
  .step.active { background: #2F8F76; box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 6px 18px rgba(47,143,118,0.5); }
  .step.active .n, .step.active .lbl { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div id="pill">
  <div class="tag">Pipeline<b id="count">—</b></div>
  <div class="steps">
    <div class="step" id="s-ingest"><span class="n">01</span><span class="lbl">Ingest</span></div>
    <div class="step" id="s-triage"><span class="n">02</span><span class="lbl">Triage</span></div>
    <div class="step" id="s-decide"><span class="n">03</span><span class="lbl">Decide</span></div>
    <div class="step" id="s-deliver"><span class="n">04</span><span class="lbl">Deliver</span></div>
    <div class="step" id="s-remember"><span class="n">05</span><span class="lbl">Remember</span></div>
  </div>
</div>
<script>
  const active = new URLSearchParams(location.search).get('active');
  const stages = ['ingest', 'triage', 'decide', 'deliver', 'remember'];
  const idx = stages.indexOf(active);
  document.getElementById('count').textContent = idx >= 0 ? `0${idx + 1} / 05` : '5 stages';
  stages.forEach((s, i) => {
    const el = document.getElementById('s-' + s);
    if (idx >= 0 && i < idx) el.classList.add('done');
    else if (i === idx) el.classList.add('active');
  });
</script>
</body>
</html>
