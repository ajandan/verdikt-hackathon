<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Beat 0a — Title card</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* Title card wants the mark front-and-center, not tucked in the corner.
     Suppress the common.css body::before mark and draw a large centered one. */
  body::before { display: none; }

  .title-stage {
    width: 1920px; height: 1080px;
    padding: 0;
    align-items: center; justify-content: center;
    background: var(--ink-50);
    position: relative;
    overflow: hidden;
  }
  /* subtle paper texture using layered radial gradients */
  .title-stage::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 20% 15%, rgba(47,143,118,0.06), transparent 60%),
      radial-gradient(900px 600px at 85% 85%, rgba(30,95,79,0.05), transparent 60%);
    pointer-events: none;
  }
  .lockup-top {
    position: absolute; top: 90px; left: 0; right: 0;
    text-align: center;
    font-family: var(--font-mono); font-size: 18px;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--seal-700);
  }
  .lockup-top .sep { color: var(--ink-300); margin: 0 14px; }

  .mark-hero {
    width: 220px; height: 220px;
    background-image: url('verdikt-mark.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    margin-bottom: 18px;
    filter: drop-shadow(0 30px 60px rgba(20,20,16,0.15));
  }
  .wordmark {
    font-family: var(--font-serif);
    font-size: 260px;
    font-weight: 400;
    font-style: italic;
    color: var(--ink-900);
    line-height: 0.9;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .wordmark .dot { color: var(--seal-500); font-style: normal; }
  .subline {
    font-family: var(--font-serif);
    font-size: 32px;
    color: var(--ink-500);
    margin-top: 22px;
    letter-spacing: 0.02em;
  }

  .submitter-band {
    position: absolute; bottom: 100px; left: 0; right: 0;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .submitter-band .who {
    font-family: var(--font-mono); font-size: 16px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-700);
  }
  .submitter-band .who b { color: var(--seal-700); font-weight: 500; }
  .submitter-band .who .dot { color: var(--ink-300); margin: 0 12px; }
  .submitter-band .repo {
    font-family: var(--font-mono); font-size: 14px;
    color: var(--ink-500); letter-spacing: 0.10em;
  }
  .rule {
    width: 120px; height: 1px; background: var(--ink-300);
    margin-bottom: 6px; opacity: 0.7;
  }
</style>
</head>
<body>
<main class="stage title-stage col">
  <div class="lockup-top">
    Nebius <span class="sep">&times;</span> NVIDIA <span class="sep">&middot;</span> Global AI Hackathon 2026
  </div>

  <div class="mark-hero"></div>
  <h1 class="wordmark">Verdikt<span class="dot">.</span></h1>
  <div class="subline">AI reads. Rules decide. Templates ship.</div>

  <div class="submitter-band">
    <div class="rule"></div>
    <div class="who">Submitted by <b>Ajanthan Arulananthar</b></div>
    <div class="repo">github.com/ajandan/verdikt-hackathon &nbsp;&middot;&nbsp; MIT</div>
  </div>
</main>
</body>
</html>
