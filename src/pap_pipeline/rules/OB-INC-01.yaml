id: OB-INC-01
program: oncobridge-pap-2026
kind: financial
fields:
  - household_size
  - annual_household_income
title: Household income at or below 250% FPL for household size
criterion: >-
  `annual_household_income` ≤ 250% × 2026 FPL(`household_size`)
exception: >-
  If either `household_size` or `annual_household_income` is blank, return
  missing_info instead of deny.
