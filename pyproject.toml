[project]
name = "docgen"
version = "0.1.0"
description = "Template-based document generation service (design-time AI, deterministic render)."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Lower bounds picked to exclude known CVE ranges:
    #   fastapi <0.115.8         → CVE-2026-2978 (Starlette BadHost / RCE chain)
    #   python-multipart <0.0.31 → CVE-2024-53981 + follow-on DoS fixes
    #   jinja2 <3.1.5            → CVE-2024-56201 / 56326 (sandbox escapes)
    #   urllib3 <2.5             → CVE-2025-50181 / 50182 (redirect handling)
    #   pyjwt <2.10              → CVE-2024-53861 (aud claim validation)
    #   cryptography <44         → several 2024-2025 OpenSSL fan-out CVEs
    # PyJWT, urllib3, cryptography are transitive today (mcp, botocore,
    # pdfminer.six) but declared explicitly so pip resolves at or above
    # the safe floor even if the parent loosens its pin.
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.31",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "dramatiq[redis]>=1.17",
    "redis>=5.1",
    "boto3>=1.35",
    "botocore>=1.35",
    "docxtpl>=0.19",
    "python-docx>=1.1",
    # PDF templating stack (kind='pdf'). All permissive (see ADR-0001):
    #   pypdf      — AcroForm widget read + fill, page merge for flat overlay (BSD-3)
    #   pypdfium2  — page-image previews + rasterization for previews/preflight (Apache-2.0)
    #   pdfplumber — vector geometry + text-with-bboxes for field detection (MIT)
    #   reportlab  — draw the value overlay layer before merging with pypdf (BSD-3)
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "jinja2>=3.1.5",
    "lxml>=5.3",
    "httpx>=0.27",
    # `mcp.server.MCPServer` (used in mcp_server.py) is a 2.x export; earlier
    # releases exposed `FastMCP` under a different path and would fail import.
    "mcp>=2.0",
    "structlog>=24.4",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    # PyYAML powers pap_pipeline rule loading — declaring directly so we
    # don't rely on it being pulled in transitively by docxtpl et al.
    "pyyaml>=6.0",
    # Prometheus metrics: counters/histograms with per-tenant labels
    # exposed at /metrics. Pure-Python, MIT-licensed, no extension deps.
    "prometheus-client>=0.20",
    # Transitive-but-declared: floors enforced so a parent loosening its
    # pin can't pull in a known-vulnerable version. See the CVE table above.
    "urllib3>=2.5",
    "pyjwt>=2.10",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pip-licenses>=5.0",
    "pre-commit>=4.0",
]

[project.scripts]
docgen-web = "docgen.main:run"
docgen-worker = "docgen.worker:run"
docgen-mcp = "docgen.mcp_server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends(...) in default arguments is idiomatic.
    "RUF012", # SQLAlchemy's type_annotation_map / mutable class defaults are idiomatic.
    "UP037",  # Forward-ref quoted annotations sometimes required by SQLAlchemy relationship().
    "RUF002", # En-dashes/arrows in docstrings are intentional (design-doc references).
    "RUF001", # ×, – appear intentionally in rule text (400% × FPL) and script strings.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "F401"]
"scripts/**" = ["B"]
"alembic/**" = ["E", "F", "UP", "B"]  # Alembic templates and generated migrations
