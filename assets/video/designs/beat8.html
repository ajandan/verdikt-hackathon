<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Beat 8 — closing (QR card overlays on the right in the last 3s at assembly time)</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body::before { display: none; }
  .close {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    background:
      radial-gradient(1100px 700px at 12% 8%, rgba(47,143,118,0.38), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, rgba(245,158,11,0.14), transparent 62%),
      #141410;
    color: var(--ink-50);
    padding: 120px 140px;
    display: flex; flex-direction: column; justify-content: center; gap: 34px;
  }
  .close::before {  /* dot grid */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(rgba(246,245,241,0.10) 1.2px, transparent 1.5px) 0 0 / 34px 34px;
    -webkit-mask-image: linear-gradient(120deg, #000, transparent 70%);
            mask-image: linear-gradient(120deg, #000, transparent 70%);
  }
  .close > * { position: relative; }
  .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
          background: linear-gradient(180deg, var(--seal-300), var(--seal-500), var(--seal-700)); }
  .mark { width: 96px; height: 96px; border-radius: 26px; background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.14); display: grid; place-items: center; }
  .mark img { width: 62px; height: 62px; filter: brightness(1.3); }
  h1 { font-family: var(--font-serif); font-weight: 400; font-size: 190px; line-height: 0.95;
       letter-spacing: -0.03em; margin: 0; }
  h1 i { color: var(--seal-300); }
  .tag { font-family: var(--font-serif); font-style: italic; font-size: 48px; color: var(--ink-200); margin: 0; }
  .tag b { font-style: normal; font-weight: 400; color: var(--ink-50); }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; max-width: 980px; }
  .chip { font-family: var(--font-mono); font-size: 17px; letter-spacing: 0.10em; text-transform: uppercase;
          padding: 11px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16);
          background: rgba(255,255,255,0.05); color: var(--ink-100); }
  .chip.nv { background: #76b900; color: #0d0d0a; border-color: #76b900; font-weight: 600; }
  .chip.mit { border-color: var(--seal-300); color: var(--seal-300); }
  .meta { font-family: var(--font-mono); font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-300); }
  .meta b { color: var(--seal-300); font-weight: 500; }
  .by { position: absolute; left: 140px; bottom: 56px; font-family: var(--font-mono); font-size: 14px;
        letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-300); }
</style>
</head>
<body>
<main class="close">
  <div class="rail"></div>
  <div class="mark"><img src="verdikt-mark.png" alt=""></div>
  <h1>Verdikt<i>.</i></h1>
  <p class="tag">AI reads. Rules decide. <b>Templates ship.</b></p>
  <div class="chips">
    <span class="chip nv">NVIDIA open models</span>
    <span class="chip">Nebius Token Factory</span>
    <span class="chip">One deterministic reply</span>
    <span class="chip mit">MIT licensed</span>
  </div>
  <div class="meta">github.com/ajandan/quire-hackathon <span style="opacity:.5">·</span> <b>live demo &amp; dashboards linked below</b></div>
  <div class="by">Nebius × NVIDIA · Global AI Hackathon 2026</div>
</main>
</body>
</html>
