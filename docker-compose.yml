services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docgen}
      POSTGRES_DB: ${POSTGRES_DB:-docgen}
    # Host port binding removed to avoid clash with a local Windows Postgres on 5432.
    # Other compose services reach this DB via the "postgres" service DNS name inside
    # the compose network. Re-add "5432:5432" if you need to connect from the host.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgen"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/docgen-templates || true;
      mc mb -p local/docgen-documents || true;
      "

  web:
    build: .
    command: docgen-web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DOCGEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_REDIS_URL: redis://redis:6379/0
      DOCGEN_S3_ENDPOINT_URL: http://minio:9000
      DOCGEN_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCGEN_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DOCGEN_AI_PROVIDER: ${DOCGEN_AI_PROVIDER:-stub}
      DOCGEN_AI_BASE_URL: ${DOCGEN_AI_BASE_URL:-}
      DOCGEN_AI_API_KEY: ${DOCGEN_AI_API_KEY:-}
      DOCGEN_AI_MODEL: ${DOCGEN_AI_MODEL:-}
      DOCGEN_AI_TIMEOUT_SECONDS: ${DOCGEN_AI_TIMEOUT_SECONDS:-120}
      DOCGEN_PDF_LABELER_MODEL: ${DOCGEN_PDF_LABELER_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      DOCGEN_PDF_VISION_OCR_MODEL: ${DOCGEN_PDF_VISION_OCR_MODEL:-openbmb/MiniCPM-V-4_5}
      DOCGEN_PDF_LABELER_MODE: ${DOCGEN_PDF_LABELER_MODE:-auto}
      # Plugin modules imported at startup. `pap_pipeline.inbox_hook` registers
      # the PAP handler against docgen.inbox.agent so `[pap]` subject-tagged
      # mail routes to the pipeline instead of the template flow.
      DOCGEN_PLUGINS: ${DOCGEN_PLUGINS:-pap_pipeline.inbox_hook}
      DOCGEN_ENV: ${DOCGEN_ENV:-development}
      DOCGEN_ADMIN_PASSWORD_HASH: ${DOCGEN_ADMIN_PASSWORD_HASH:-}
      # One-click demo sign-in for judges (see .env.example). Off by default.
      DOCGEN_DEMO_LOGIN_ENABLED: ${DOCGEN_DEMO_LOGIN_ENABLED:-false}
      DOCGEN_DEMO_USERNAME: ${DOCGEN_DEMO_USERNAME:-}
      DOCGEN_DEMO_PASSWORD: ${DOCGEN_DEMO_PASSWORD:-}
      DOCGEN_DEMO_TENANT: ${DOCGEN_DEMO_TENANT:-}
      # No fallback: dev users must set DOCGEN_SESSION_SECRET (see .env.example
      # for a one-liner to generate one). Same for DOCGEN_WEBHOOK_SIGNING_SECRET.
      DOCGEN_SESSION_SECRET: ${DOCGEN_SESSION_SECRET:?set DOCGEN_SESSION_SECRET in .env}
      DOCGEN_WEBHOOK_SIGNING_SECRET: ${DOCGEN_WEBHOOK_SIGNING_SECRET:?set DOCGEN_WEBHOOK_SIGNING_SECRET in .env}
      DOCGEN_INBOX_ENABLED: ${DOCGEN_INBOX_ENABLED:-false}
      DOCGEN_INBOX_IMAP_HOST: ${DOCGEN_INBOX_IMAP_HOST:-}
      DOCGEN_INBOX_IMAP_PORT: ${DOCGEN_INBOX_IMAP_PORT:-993}
      DOCGEN_INBOX_USERNAME: ${DOCGEN_INBOX_USERNAME:-}
      DOCGEN_INBOX_PASSWORD: ${DOCGEN_INBOX_PASSWORD:-}
      DOCGEN_INBOX_MAILBOX: ${DOCGEN_INBOX_MAILBOX:-INBOX}
      DOCGEN_INBOX_POLL_INTERVAL_SECONDS: ${DOCGEN_INBOX_POLL_INTERVAL_SECONDS:-60}
      DOCGEN_INBOX_MAX_ATTACHMENT_BYTES: ${DOCGEN_INBOX_MAX_ATTACHMENT_BYTES:-20971520}
      DOCGEN_SMTP_HOST: ${DOCGEN_SMTP_HOST:-}
      DOCGEN_SMTP_PORT: ${DOCGEN_SMTP_PORT:-587}
      DOCGEN_SMTP_USERNAME: ${DOCGEN_SMTP_USERNAME:-}
      DOCGEN_SMTP_PASSWORD: ${DOCGEN_SMTP_PASSWORD:-}
      DOCGEN_SMTP_FROM: ${DOCGEN_SMTP_FROM:-}
      DOCGEN_SMTP_USE_STARTTLS: ${DOCGEN_SMTP_USE_STARTTLS:-true}
      DOCGEN_PUBLIC_BASE_URL: ${DOCGEN_PUBLIC_BASE_URL:-}
      DOCGEN_ADMIN_BASE_URL: ${DOCGEN_ADMIN_BASE_URL:-}
    volumes:
      # Dev: bind-mount templates so UI edits reload without rebuilding the image.
      - ./src/docgen/ui/templates:/app/src/docgen/ui/templates:ro
      # Dev: bind-mount the compiled Tailwind bundle so `scripts/build-css.ps1 -Watch`
      # on the host live-updates styles inside the container. Run the script once
      # before `docker compose up` to seed src/docgen/ui/static/app.css.
      - ./src/docgen/ui/static:/app/src/docgen/ui/static:ro
      # Dev: bind-mount the engineering dashboards so the /engineering/ mount
      # picks up new report snapshots without rebuilding the image.
      - ./reports:/app/reports:ro
    ports:
      - "8100:8000"

  worker:
    build: .
    command: docgen-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DOCGEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_REDIS_URL: redis://redis:6379/0
      DOCGEN_S3_ENDPOINT_URL: http://minio:9000
      DOCGEN_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCGEN_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Settings() validates these at import time — worker crashes on start
      # without them. Session secret is used by signed download URLs the
      # worker mints when returning render results.
      DOCGEN_ENV: ${DOCGEN_ENV:-development}
      DOCGEN_SESSION_SECRET: ${DOCGEN_SESSION_SECRET:?set DOCGEN_SESSION_SECRET in .env}
      DOCGEN_WEBHOOK_SIGNING_SECRET: ${DOCGEN_WEBHOOK_SIGNING_SECRET:?set DOCGEN_WEBHOOK_SIGNING_SECRET in .env}
      # PDF labeler envs — the inbox agent's PDF branch calls
      # label_fields_in_pdf via pick_pdf_labeler_backend, which reads these
      # settings. Without them the labeler no-ops (inbox_pdf_ai_label_skipped
      # reason=no_labeler_backend) and templates ingest with raw AcroForm
      # names as labels.
      DOCGEN_AI_PROVIDER: ${DOCGEN_AI_PROVIDER:-stub}
      DOCGEN_AI_BASE_URL: ${DOCGEN_AI_BASE_URL:-}
      DOCGEN_AI_API_KEY: ${DOCGEN_AI_API_KEY:-}
      DOCGEN_AI_MODEL: ${DOCGEN_AI_MODEL:-}
      DOCGEN_AI_TIMEOUT_SECONDS: ${DOCGEN_AI_TIMEOUT_SECONDS:-120}
      DOCGEN_PDF_LABELER_MODEL: ${DOCGEN_PDF_LABELER_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      DOCGEN_PDF_VISION_OCR_MODEL: ${DOCGEN_PDF_VISION_OCR_MODEL:-openbmb/MiniCPM-V-4_5}
      DOCGEN_PDF_LABELER_MODE: ${DOCGEN_PDF_LABELER_MODE:-auto}
      # See web service — same plugin registration story on the worker side,
      # which is where process_message actually runs and needs the handler.
      DOCGEN_PLUGINS: ${DOCGEN_PLUGINS:-pap_pipeline.inbox_hook}
      DOCGEN_INBOX_ENABLED: ${DOCGEN_INBOX_ENABLED:-false}
      DOCGEN_INBOX_IMAP_HOST: ${DOCGEN_INBOX_IMAP_HOST:-}
      DOCGEN_INBOX_IMAP_PORT: ${DOCGEN_INBOX_IMAP_PORT:-993}
      DOCGEN_INBOX_USERNAME: ${DOCGEN_INBOX_USERNAME:-}
      DOCGEN_INBOX_PASSWORD: ${DOCGEN_INBOX_PASSWORD:-}
      DOCGEN_INBOX_MAILBOX: ${DOCGEN_INBOX_MAILBOX:-INBOX}
      DOCGEN_INBOX_POLL_INTERVAL_SECONDS: ${DOCGEN_INBOX_POLL_INTERVAL_SECONDS:-60}
      DOCGEN_INBOX_MAX_ATTACHMENT_BYTES: ${DOCGEN_INBOX_MAX_ATTACHMENT_BYTES:-20971520}
      DOCGEN_SMTP_HOST: ${DOCGEN_SMTP_HOST:-}
      DOCGEN_SMTP_PORT: ${DOCGEN_SMTP_PORT:-587}
      DOCGEN_SMTP_USERNAME: ${DOCGEN_SMTP_USERNAME:-}
      DOCGEN_SMTP_PASSWORD: ${DOCGEN_SMTP_PASSWORD:-}
      DOCGEN_SMTP_FROM: ${DOCGEN_SMTP_FROM:-}
      DOCGEN_SMTP_USE_STARTTLS: ${DOCGEN_SMTP_USE_STARTTLS:-true}
      # Deep-link base for the "Open the template" line in reply emails.
      # The link function falls back through admin_base_url → public_base_url,
      # so passing both mirrors the web service and future-proofs deploys
      # that split admin vs public hostnames.
      DOCGEN_PUBLIC_BASE_URL: ${DOCGEN_PUBLIC_BASE_URL:-}
      DOCGEN_ADMIN_BASE_URL: ${DOCGEN_ADMIN_BASE_URL:-}

  # Test runner — ephemeral one-shot service that hits the same compose
  # network as web/worker so tests reach postgres/redis/minio by service
  # name (no host port bindings required). Built from the Dockerfile's
  # `dev` stage which layers pytest + ruff on top of the runtime image.
  #
  # Run:            docker compose --profile test run --rm test
  # Narrow subset:  docker compose --profile test run --rm \
  #                     -e PYTEST_ARGS="tests/test_boundaries.py -q" test
  #
  # The `test` profile guard keeps it out of the default `docker compose
  # up` set — nothing spins up unless the profile is explicitly named,
  # so prod-shaped runs (`docker compose up`) are unaffected.
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DOCGEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_REDIS_URL: redis://redis:6379/0
      DOCGEN_S3_ENDPOINT_URL: http://minio:9000
      DOCGEN_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCGEN_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Test secrets: match tests/conftest.py's setdefault so the HMAC-signed
      # values (webhook body, download tokens) hash to the same digests the
      # tests assert on. Alembic runs before conftest, so we need these at
      # the container-env level too.
      DOCGEN_SESSION_SECRET: test-session-secret
      DOCGEN_WEBHOOK_SIGNING_SECRET: test-webhook-secret
      DOCGEN_ENV: development
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      # `scripts/` mounted so `ruff check src tests scripts` (the CI
      # command) can see the same file set inside the container.
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    # Migrate then run the suite. `sh -c` because compose can only take a
    # single CMD-style array; chaining `alembic && pytest` keeps the exit
    # code honest (a failed migration aborts the run instead of pytest
    # reporting fixture errors from an empty schema).
    command: >
      sh -c "alembic upgrade head && pytest $${PYTEST_ARGS:--q}"

volumes:
  pgdata:
  miniodata:
