id: CV-CLIN-01
program: cardiovita-pap-2026
kind: clinical
fields:
  - prescribed_drug
  - prescriber_npi
  - prescription_date
title: Current Cardiovita Rx from active U.S. prescriber with valid NPI
criterion: >-
  `prescribed_drug` = "Cardiovita" AND `prescriber_npi` active in NPPES AND
  `prescription_date` within last 12 months
exception: >-
  Off-label indications allowed if documented in `dx_primary_description` /
  `dx_primary_icd10`. Signature stamps not accepted.
