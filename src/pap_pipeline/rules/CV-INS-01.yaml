id: CV-INS-01
program: cardiovita-pap-2026
kind: insurance
fields:
  - insurance_status
  - has_denial_letter
title: Applicant lacks adequate prescription drug coverage
criterion: >-
  `insurance_status` ∈ {uninsured, Medicare without Part D, commercial with
  `has_denial_letter`=true}
exception: >-
  Medicaid enrollees are ineligible. Commercial insurance requires an
  attached denial letter.
