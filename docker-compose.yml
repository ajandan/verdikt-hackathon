services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docgen}
      POSTGRES_DB: ${POSTGRES_DB:-docgen}
    # Host port binding removed to avoid clash with a local Windows Postgres on 5432.
    # Other compose services reach this DB via the "postgres" service DNS name inside
    # the compose network. Re-add "5432:5432" if you need to connect from the host.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgen"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/docgen-templates || true;
      mc mb -p local/docgen-documents || true;
      "

  web:
    build: .
    command: docgen-web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DOCGEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_REDIS_URL: redis://redis:6379/0
      DOCGEN_S3_ENDPOINT_URL: http://minio:9000
      DOCGEN_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCGEN_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DOCGEN_AI_PROVIDER: ${DOCGEN_AI_PROVIDER:-stub}
      DOCGEN_AI_BASE_URL: ${DOCGEN_AI_BASE_URL:-}
      DOCGEN_AI_API_KEY: ${DOCGEN_AI_API_KEY:-}
      DOCGEN_AI_MODEL: ${DOCGEN_AI_MODEL:-gpt-4o-mini}
      DOCGEN_MISTRAL_API_KEY: ${DOCGEN_MISTRAL_API_KEY:-}
      DOCGEN_MISTRAL_OCR_MODEL: ${DOCGEN_MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      DOCGEN_MISTRAL_CHAT_MODEL: ${DOCGEN_MISTRAL_CHAT_MODEL:-pixtral-12b-2409}
      DOCGEN_ENV: ${DOCGEN_ENV:-development}
      DOCGEN_ADMIN_PASSWORD_HASH: ${DOCGEN_ADMIN_PASSWORD_HASH:-}
      # No fallback: dev users must set DOCGEN_SESSION_SECRET (see .env.example
      # for a one-liner to generate one). Same for DOCGEN_WEBHOOK_SIGNING_SECRET.
      DOCGEN_SESSION_SECRET: ${DOCGEN_SESSION_SECRET:?set DOCGEN_SESSION_SECRET in .env}
      DOCGEN_WEBHOOK_SIGNING_SECRET: ${DOCGEN_WEBHOOK_SIGNING_SECRET:?set DOCGEN_WEBHOOK_SIGNING_SECRET in .env}
    volumes:
      # Dev: bind-mount templates so UI edits reload without rebuilding the image.
      - ./src/docgen/ui/templates:/app/src/docgen/ui/templates:ro
      # Dev: bind-mount the compiled Tailwind bundle so `scripts/build-css.ps1 -Watch`
      # on the host live-updates styles inside the container. Run the script once
      # before `docker compose up` to seed src/docgen/ui/static/app.css.
      - ./src/docgen/ui/static:/app/src/docgen/ui/static:ro
    ports:
      - "8000:8000"

  worker:
    build: .
    command: docgen-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DOCGEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@postgres:5432/${POSTGRES_DB:-docgen}
      DOCGEN_REDIS_URL: redis://redis:6379/0
      DOCGEN_S3_ENDPOINT_URL: http://minio:9000
      DOCGEN_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCGEN_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

volumes:
  pgdata:
  miniodata:
